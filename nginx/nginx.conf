worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Package runs are bounded backend-side (runner_config.run_bounded), with
    # a 120s default and per-package overrides applied per attempt — and the
    # provider retries once. A proxy timeout under that would cut the client
    # off while the run is still legitimately in flight.
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Hebrew summary payloads compress well; skip already-compressed types.
        gzip on;
        gzip_types text/plain text/css application/json application/javascript
                   text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        client_max_body_size 20m;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The anonymous conversation session rides an HttpOnly signed
            # cookie, so it must survive the proxy hop untouched.
            proxy_pass_request_headers on;

            # Summaries stream in progressively; buffering would hold the
            # whole response back and defeat the incremental rendering.
            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js dev/HMR websocket upgrade.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
