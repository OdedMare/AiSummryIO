{{- if include "aisummry-backend.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aisummry-backend.secretName" . }}
  labels:
    {{- include "aisummry-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.llm.apiKey (not .Values.llm.existingSecret) }}
  openai-api-key: {{ .Values.llm.apiKey | quote }}
  {{- end }}
  {{- if and .Values.flapi.token (not .Values.flapi.existingSecret) }}
  flapi-token: {{ .Values.flapi.token | quote }}
  {{- end }}
  {{- if and .Values.auth.adminPassword (not .Values.auth.existingSecret) }}
  admin-password: {{ .Values.auth.adminPassword | quote }}
  {{- end }}
  {{- if and .Values.auth.cookieSecret (not .Values.auth.existingSecret) }}
  cookie-secret: {{ .Values.auth.cookieSecret | quote }}
  {{- end }}
{{- end }}
