replicaCount: 1

image:
  repository: ghcr.io/odedmare/aisummry-frontend
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 3000

# next.config.ts rewrites /api/* to this URL server-side, so the browser
# stays same-origin and no CORS setup is needed. It must be reachable from
# the frontend pod — a cluster-internal Service name, not a public host.
#
# `backend.fullnameOverride` is unset by default, so the backend Service is
# named "<release>-aisummry-backend". Set `url` outright if the backend was
# installed under a different release name.
backend:
  url: ""
  releaseName: ""     # defaults to this chart's release name
  port: 8000

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000     # the `node` user in node:20-alpine
  runAsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  hosts:
    - host: aisummry.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# `next start` serves the app root; a TCP probe avoids depending on any one
# route staying available.
livenessProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: true
  periodSeconds: 5
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

extraEnv: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
