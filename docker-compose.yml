services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: summaries
      POSTGRES_USER: summaries
      POSTGRES_PASSWORD: summaries
    volumes:
      - summaries-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summaries"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      AISUMMRY_DATABASE_URL: postgresql://summaries:summaries@db:5432/summaries
      AISUMMRY_RUNTIME_SETTINGS_FILE: /data/runtime-settings.json
      AISUMMRY_ADMIN_PASSWORD: ${AISUMMRY_ADMIN_PASSWORD:-}
    volumes:
      - summaries-settings:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  summaries-db:
  summaries-settings:

