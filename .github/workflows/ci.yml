name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build only — the image is never pushed. This catches a broken
      # Dockerfile or an unresolvable dependency pin on the PR that
      # introduced it rather than at deploy time.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: aisummry-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # The image installs the package; importing the app proves the build
      # produced something that actually starts, not just layers that ran.
      - name: Import app
        run: |
          docker run --rm --entrypoint python \
            aisummry-backend:${{ github.sha }} \
            -c "import app.main; print('app.main imported')"

  frontend-image:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # `npm run build` runs inside the Dockerfile, so a type error or a
      # failed Next build fails this step.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: aisummry-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  helm:
    name: Lint charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # `lint` catches malformed charts; `template` catches templates that
      # only break once values are rendered.
      - name: Lint and render
        run: |
          for chart in deploy/helm/backend deploy/helm/frontend; do
            echo "::group::$chart"
            helm lint "$chart"
            helm template ci-test "$chart" > /dev/null
            echo "::endgroup::"
          done
